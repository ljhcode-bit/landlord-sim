<!DOCTYPE html>
<html lang="ko" class="light" style="color-scheme: light only;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#AEE2FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <title>갓물주 라이프 3D: 미니미 타운</title>

  <!-- 눈누(Noonnu) 상용 캐주얼 게임 전용 둥근 폰트 프리로드 -->
  <link rel="preload" href="https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff" as="font" type="font/woff" crossorigin />
  <link rel="preload" href="https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff" as="font" type="font/woff" crossorigin />
  <link rel="preload" href="https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/omyu_pretty.woff2" as="font" type="font/woff2" crossorigin />

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="select-none overflow-hidden">

  <!-- ==================== 1. WebGL 3D 파스텔 타운 뷰포트 ==================== -->
  <div id="webgl-container"></div>

  <!-- [핵심 1] 전체화면 단독 룸 뷰 전용 스튜디오 소프트 비네팅/아이솔레이션 레이어 -->
  <div id="room-isolation-vignette" class="hidden fixed inset-0 z-10 pointer-events-none"></div>

  <!-- ==================== 2. 3D 투영(Project) 오버레이 레이어 ==================== -->
  <div id="overlay-3d-layer">
    <div id="lots-overlay-layer"></div>
    <div id="rooms-overlay-layer"></div>
    <div id="crisis-pins-layer"></div>
    <div id="rent-bubbles-layer"></div>
    <div id="speech-overlay-layer"></div>
    <div id="care-overlay-layer"></div>
    <div id="jackpot-overlay-layer"></div>
  </div>

  <!-- 코인 상단 비행 레이어 -->
  <div id="flying-coin-layer" class="fixed inset-0 z-40 pointer-events-none overflow-hidden"></div>

  <!-- ==================== 3. 겹침 없는 상단 3캡슐 HUD & 룸 뷰 복귀 바 ==================== -->
  <header class="fixed top-2.5 left-2.5 right-2.5 sm:right-auto sm:left-4 sm:top-3.5 z-30 flex flex-col gap-1.5 pointer-events-none sm:w-[420px]">
    <!-- 1열: 3개 핵심 상태 캡슐 한 줄 고정 정렬 -->
    <div class="hud-top-row pointer-events-auto">
      <!-- 캡슐 1: 보유 자산 -->
      <div id="hud-badge-gold" class="hud-clay-badge hud-stat-pill">
        <span id="hud-ico-gold" class="flex items-center justify-center shrink-0"></span>
        <div class="leading-tight min-w-0">
          <div class="text-[10px] font-display text-[#7A6254] leading-none truncate">보유자산</div>
          <div id="hud-gold-wrap" class="font-title text-[13px] sm:text-base text-[#4A3728] leading-tight mt-0.5 whitespace-nowrap">
            <span id="hud-gold" class="font-num">880</span><span class="text-[10.5px] ml-0.5">만</span>
          </div>
        </div>
      </div>

      <!-- 캡슐 2: 주기 순익 -->
      <div id="hud-badge-yield" class="hud-clay-badge hud-stat-pill">
        <span id="hud-ico-yield" class="flex items-center justify-center shrink-0"></span>
        <div class="leading-tight min-w-0">
          <div class="text-[10px] font-display text-[#7A6254] leading-none truncate">주기순익</div>
          <div id="hud-net-income" class="font-num text-[13px] sm:text-base text-[#0D9488] leading-tight mt-0.5 whitespace-nowrap">+28만</div>
        </div>
      </div>

      <!-- 캡슐 3: 타운 행복도 -->
      <div id="hud-badge-happy" class="hud-clay-badge hud-stat-pill">
        <span id="hud-ico-happy" class="flex items-center justify-center shrink-0"></span>
        <div class="leading-tight min-w-0">
          <div class="text-[10px] font-display text-[#7A6254] leading-none truncate">행복도</div>
          <div id="hud-happiness" class="font-num text-[13px] sm:text-base text-[#E11D48] leading-tight mt-0.5 whitespace-nowrap">100%</div>
        </div>
      </div>
    </div>

    <!-- 2열 A: 타운 전체 뷰 보조 컨트롤 바 -->
    <div id="hud-town-controls" class="flex items-center gap-1.5 flex-wrap">
      <button id="btn-overview-cam" title="타운 전체 보기" class="pointer-events-auto milk-float-btn border-sky">
        <span id="hud-ico-overview" class="flex items-center"></span>
        <span>타운 전체뷰</span>
      </button>

      <button id="btn-collect-all" class="hidden pointer-events-auto milk-float-btn border-gold animate-bounce">
        <span id="hud-ico-collect" class="flex items-center"></span>
        <span>일괄수금!</span>
      </button>

      <div class="pointer-events-auto hidden md:inline-flex milk-float-pill">
        <span id="hud-time-text" class="font-display text-[11px] text-[#4A3728]">1일차 09:00</span>
        <span id="hud-xray-badge" class="font-display text-[10.5px] px-2 py-0.5 rounded-full bg-[#E0F2FE] text-[#0369A1] border border-[#BAE6FD]">외관 100%</span>
      </div>
    </div>

    <!-- 2열 B: [핵심 1] 전체화면 단독 룸 뷰 전용 나가기 & 평형 빠른 전환 바 -->
    <div id="room-focus-topbar" class="hidden flex flex-col gap-1.5">
      <div class="flex items-center gap-1.5 flex-wrap">
        <button id="btn-exit-room-view" class="pointer-events-auto exit-room-pill-btn">
          <span>🔙 건물 전체로 나가기</span>
        </button>
        <span class="pointer-events-none hidden sm:inline-flex milk-float-pill !py-1 !px-2.5 text-[11px] text-[#7A6254]">
          ↻ 좌우 드래그로 방 내부 회전 관찰
        </span>
      </div>
      <div id="room-switcher-chips" class="pointer-events-auto flex items-center gap-1 overflow-x-auto custom-scroll pb-0.5"></div>
    </div>
  </header>

  <!-- ==================== 4. 전체화면 룸 뷰 우측 상단 컴팩트 세대/호실 카드 ==================== -->
  <aside id="room-focus-panel" class="hidden fixed top-[112px] lg:top-3.5 right-2.5 sm:right-4 z-30 w-[248px] sm:w-[276px] max-h-[calc(100vh-310px)] diary-inspector-shell flex flex-col overflow-hidden">
    <div class="px-3 py-2 flex items-center justify-between border-b border-[#F2D7B6] shrink-0" style="background: linear-gradient(180deg, #FFFDF7 0%, #FFF4E4 100%);">
      <div class="flex items-center gap-1.5 min-w-0">
        <span id="rf-room-num" class="hotel-num-tag shrink-0">101</span>
        <span id="rf-type-badge" class="kw-chip tone-sky !py-0.5 !px-2 shrink-0">🏠 원룸</span>
        <span id="rf-title" class="diary-card-title truncate hidden sm:inline">해피 미니미 타운 1차</span>
        <button id="rf-btn-rename" title="빌딩 이름 변경" class="ribbon-edit-chip shrink-0"></button>
        <span id="rf-tier-badge" class="diary-pill-badge shrink-0">Lv.0</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="btn-toggle-rf-body" title="세대 카드 접기/펼치기" class="btn-close-round !w-6 !h-6 !text-[10px]">▾</button>
        <button id="btn-close-room-focus" title="건물 전체로 나가기" class="btn-close-round !w-6 !h-6">✕</button>
      </div>
    </div>
    <div id="rf-body" class="p-2.5 overflow-y-auto custom-scroll space-y-2"></div>
  </aside>

  <!-- ==================== 5. [핵심 3] 인테리어 가구·시설 종류별 선택 카탈로그 바텀시트 ==================== -->
  <section id="furniture-catalog-sheet" class="hidden fixed bottom-0 left-0 right-0 z-30 pointer-events-none flex justify-center px-2 sm:px-4 pb-2 sm:pb-2.5">
    <div class="pointer-events-auto furniture-sheet-shell w-full max-w-4xl">
      <!-- 상단 타이틀 & 접기 토글 바 -->
      <div class="px-3 py-1.5 flex items-center justify-between gap-2 border-b border-[#F2D7B6]" style="background: linear-gradient(90deg, #FFFDF7 0%, #FFF5EC 55%, #F2FCF9 100%);">
        <div class="flex items-center gap-2 min-w-0 flex-wrap">
          <span class="font-title text-[13px] sm:text-[14.5px] text-[#3E2C23] whitespace-nowrap">🛋️ 인테리어 가구 카탈로그</span>
          <span id="fcat-room-badge" class="kw-chip tone-coral !py-0.5 !px-2">101호 · 원룸 스튜디오</span>
          <span id="fcat-bonus-badge" class="kw-chip tone-mint !py-0.5 !px-2">인테리어 +0만</span>
        </div>
        <button id="btn-toggle-catalog" type="button" class="diary-pill-badge cursor-pointer hover:!bg-[#FFF3CD] shrink-0">
          ▼ 접기
        </button>
      </div>

      <!-- 카탈로그 본문 (4개 카테고리 탭 + 4종 가구 선택 카드) -->
      <div id="fcat-collapsible-body" class="bg-[#FFFDF7]">
        <!-- 줄바꿈 없는 4개 카테고리 탭 -->
        <div id="fcat-tabs-row" class="grid grid-cols-4 gap-1.5 px-2.5 pt-2 pb-1.5 bg-[#FFF9F0] border-b border-[#F2DEC4]">
          <button type="button" data-fcat="bed" class="fcat-tab-btn active">
            <span>🛏️ 침실/침대</span>
          </button>
          <button type="button" data-fcat="sofa" class="fcat-tab-btn">
            <span>🛋️ 거실/소파</span>
          </button>
          <button type="button" data-fcat="appliance" class="fcat-tab-btn">
            <span>🖥️ 주방/가전</span>
          </button>
          <button type="button" data-fcat="decor" class="fcat-tab-btn">
            <span>🎨 벽지/바닥/복층계단</span>
          </button>
        </div>

        <!-- 아이템 선택 그리드 -->
        <div id="fcat-items-grid" class="fcat-cards-row p-2.5 custom-scroll"></div>
      </div>
    </div>
  </section>

  <!-- ==================== 6. 우측 하단 밀크 화이트 카메라 바 & 원형 수첩 FAB ==================== -->
  <div id="bottom-town-bar" class="fixed bottom-3 right-3 sm:bottom-4 sm:right-4 z-30 flex items-center gap-2 pointer-events-none">
    <div class="pointer-events-auto milk-cam-bar px-2 py-1 flex items-center gap-1">
      <button id="btn-zoom-in" title="확대 (내부 투시)" class="w-7 h-7 rounded-full hover:bg-[#FFF5EA] font-title text-base text-[#4A3728] transition-colors">+</button>
      <button id="btn-zoom-out" title="축소 (마을 전체)" class="w-7 h-7 rounded-full hover:bg-[#FFF5EA] font-title text-base text-[#4A3728] transition-colors">−</button>
      <button id="btn-cam-rotate" title="카메라 90도 회전" class="w-7 h-7 rounded-full hover:bg-[#FFF5EA] font-title text-sm text-[#4A3728] transition-colors">↻</button>
      <button id="btn-reset-save" title="데이터 초기화" class="px-2 h-7 rounded-full hover:bg-[#FFE8EE] font-display text-[11px] text-[#6E5649] transition-colors whitespace-nowrap">초기화</button>
    </div>

    <button id="fab-notebook" aria-label="타운 도감 수첩 열기" class="pointer-events-auto fab-artwork-circle">
      <span id="fab-svg-slot" class="fab-icon-wrap flex items-center justify-center"></span>
      <span class="font-title text-[11px] text-[#3E2C23] leading-none mt-0.5">수첩</span>

      <span id="fab-red-dot" class="hidden urgent-coral-dot absolute -top-1.5 -right-1.5 min-w-[22px] h-[22px] px-1 font-num text-[11px] flex items-center justify-center">
        1
      </span>
    </button>
  </div>

  <!-- ==================== 7. 밝은 바닐라 크림 단일 통합형 타운 수첩 모달 ==================== -->
  <div id="notebook-modal" class="hidden fixed inset-0 z-50 pastel-modal-backdrop flex items-center justify-center p-2.5 sm:p-4">
    <div class="cozy-planner-shell w-full max-w-2xl h-[85vh] max-h-[580px]">
      <div id="notebook-binder-rings" class="planner-top-rings"></div>

      <div class="cozy-planner-inner">
        <div class="px-3.5 py-2.5 flex items-center justify-between border-b border-[#F2D7B6] shrink-0" style="background: linear-gradient(90deg, #FFFDF7 0%, #FFF5EC 55%, #F2FCF9 100%);">
          <div class="flex items-center gap-2 min-w-0">
            <span id="modal-ico-notebook" class="flex items-center shrink-0"></span>
            <span class="diary-modal-title whitespace-nowrap">타운 경영 수첩</span>
            <span id="modal-quest-summary" class="diary-pill-badge !bg-[#FFF3CD] !text-[#854D0E] !border-[#FDE047] shrink-0">0/10</span>
            <span id="modal-alert-summary" class="hidden diary-pill-badge !bg-[#FFE4EC] !text-[#BE123C] !border-[#FDA4AF] shrink-0"></span>
          </div>
          <button id="btn-close-notebook" class="btn-close-round">✕</button>
        </div>

        <!-- 절대 줄바꿈되지 않는 상단 4개 인덱스 탭 (퀘스트 / 세대도감 / 관리인 / 건물장부) -->
        <div class="grid grid-cols-4 gap-1.5 px-2.5 pt-2.5 pb-2 bg-[#FFF9F0] border-b border-[#F2D7B6] shrink-0">
          <button data-ntab="quests" class="ntab-btn diary-index-tab active">
            <span id="tab-ico-quests" class="hidden sm:flex items-center shrink-0"></span>
            <span>퀘스트</span>
            <span id="tab-dot-quests" class="hidden w-2 h-2 rounded-full bg-[#FF4D6D] shrink-0"></span>
          </button>
          <button data-ntab="tenants" class="ntab-btn diary-index-tab">
            <span id="tab-ico-tenants" class="hidden sm:flex items-center shrink-0"></span>
            <span>세대도감</span>
            <span id="tab-dot-tenants" class="hidden w-2 h-2 rounded-full bg-[#FF4D6D] shrink-0 animate-ping"></span>
          </button>
          <button data-ntab="manager" class="ntab-btn diary-index-tab">
            <span id="tab-ico-manager" class="hidden sm:flex items-center shrink-0"></span>
            <span>관리인</span>
          </button>
          <button data-ntab="infra" class="ntab-btn diary-index-tab">
            <span id="tab-ico-infra" class="hidden sm:flex items-center shrink-0"></span>
            <span>건물장부</span>
          </button>
        </div>

        <!-- 이중 중복 없는 단일 통합 카드 리스트 영역 -->
        <div id="notebook-unified-body" class="planner-unified-sheet flex-1 overflow-y-auto custom-scroll p-3 sm:p-4 space-y-2.5"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 8. 신규 부지 개발 모달 (밝은 크림 테마) ==================== -->
  <div id="lot-dev-modal" class="hidden fixed inset-0 z-50 pastel-modal-backdrop flex items-center justify-center p-3">
    <div class="cozy-planner-shell w-full max-w-xl max-h-[84vh]">
      <div class="cozy-planner-inner">
        <div class="px-3.5 py-2.5 flex items-center justify-between border-b border-[#F2D7B6] shrink-0" style="background: linear-gradient(90deg, #F0FDF9 0%, #FFFDF7 100%);">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="dev-ico-header" class="flex items-center"></span>
            <span class="diary-modal-title">신규 부지 착공</span>
            <span id="dev-lot-badge" class="diary-pill-badge"></span>
          </div>
          <button id="btn-close-dev-modal" class="btn-close-round">✕</button>
        </div>
        <div id="dev-cards-grid" class="p-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5 overflow-y-auto custom-scroll"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 9. 세대 입주 계약 모달 (밝은 크림 테마) ==================== -->
  <div id="recruit-modal" class="hidden fixed inset-0 z-50 pastel-modal-backdrop flex items-center justify-center p-3">
    <div class="cozy-planner-shell w-full max-w-2xl max-h-[86vh]">
      <div class="cozy-planner-inner">
        <div class="px-3.5 py-2.5 flex items-center justify-between border-b border-[#F2D7B6] shrink-0" style="background: linear-gradient(90deg, #FFF5F7 0%, #FFFDF7 100%);">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="rec-ico-header" class="flex items-center"></span>
            <span class="diary-modal-title">입주 세대 선택</span>
            <span id="rec-room-title" class="diary-pill-badge"></span>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="btn-refresh-rec" class="jelly-action-btn pill btn-gold-lip !py-1 !px-2.5">후보 교체 10만</button>
            <button id="btn-close-recruit" class="btn-close-round">✕</button>
          </div>
        </div>
        <div id="rec-cards-grid" class="p-3 grid grid-cols-1 sm:grid-cols-3 gap-2.5 overflow-y-auto custom-scroll"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 10. 빌딩 이름 현판 각인 미니 모달 ==================== -->
  <div id="rename-building-modal" class="hidden fixed inset-0 z-[58] pastel-modal-backdrop flex items-center justify-center p-3">
    <div class="cozy-planner-shell w-full max-w-sm">
      <div class="cozy-planner-inner p-3.5 space-y-2.5">
        <div class="flex items-center justify-between border-b border-[#F2D7B6] pb-2">
          <div class="flex items-center gap-2">
            <span id="rename-ico-crown" class="flex items-center"></span>
            <span class="diary-modal-title">빌딩 현판 이름 변경</span>
          </div>
          <button id="btn-close-rename" class="btn-close-round">✕</button>
        </div>

        <input id="input-building-name" type="text" maxlength="16" placeholder="예: 럭키 팰리스, 진형 타워" class="diary-rename-input" />

        <div id="rename-presets-row" class="flex flex-wrap gap-1.5"></div>

        <div class="flex justify-end gap-2 pt-1">
          <button id="btn-cancel-rename" class="diary-pill-badge cursor-pointer !px-3 !py-1.5">취소</button>
          <button id="btn-confirm-rename" class="jelly-action-btn btn-coral-lip px-3.5 py-1.5">
            <span id="rename-ico-pen" class="flex items-center"></span>
            <span>현판 새기기</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 11. 퇴거 도장 스탬프 연출 오버레이 ==================== -->
  <div id="eviction-stamp-overlay" class="hidden fixed inset-0 z-[60] pointer-events-none">
    <div id="eviction-stamp-box" class="absolute left-1/2 top-1/2 diary-card !bg-[#FFFFFF] !border-4 !border-[#FF758F] !px-5 !py-3 flex items-center gap-2.5 font-title text-lg sm:text-2xl text-[#BE123C]">
      <span id="stamp-ico-slot" class="flex items-center"></span>
      <span>퇴거 집행 완료</span>
    </div>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toast-container" class="fixed top-20 sm:top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-1.5 pointer-events-none"></div>

  <script src="./data.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
